name: Mutation

# Weekly StrykerJS (packages/core `stryker.config.mjs`), one job per shard of the high-risk modules,
# against the core unit and integration tiers and the e2e tier in packages/testing. Incremental: the
# previous run's report artifact means only mutants in code or tests that changed since then are
# re-tested. A report, not a gate.
on:
  schedule:
    # Saturday 01:00 UTC. Nightly runs were a third of the repo's Actions minutes.
    - cron: '0 1 * * 6'
  workflow_dispatch:

concurrency:
  group: mutation

env:
  DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/oss_igaming_test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/oss_igaming_test
  TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  TEST_REDIS_URL: redis://localhost:6379
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oss_igaming_test

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the previous run's incremental baseline
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard:
          - wallet-service-a
          - wallet-service-b
          - wallet-rails
          - wallet-rest
          - compliance-core
          - compliance-rest
          - audit-plugin
          - audit-rest
          - identity-service
          - identity-rest
          - promo-gamification
          - promo-bonus
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
      - uses: ./.github/actions/bootstrap
        with:
          turbo-cache: 'false'
      - uses: ./.github/actions/test-infra
      # The incremental baseline is the shard's report from the latest earlier run that has one.
      # Not actions/cache: it evicts an entry nobody read for 7 days, a weekly run's exact gap.
      - name: Restore incremental baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          # Only dev runs started by the schedule or by hand: another branch's run could upload a
          # crafted baseline that marks every mutant killed.
          for id in $(gh run list --workflow mutation.yml --branch dev --limit 10 --json databaseId,event \
            --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            # `gh run download` refuses to overwrite, so each try gets a fresh folder.
            tmp=$(mktemp -d)
            if gh run download "$id" --name "mutation-report-$SHARD" --dir "$tmp" &&
              [ -s "$tmp/stryker-incremental.json" ]; then
              mkdir -p "packages/core/reports/$SHARD"
              mv "$tmp"/* "packages/core/reports/$SHARD/"
              break
            fi
          done
      - run: pnpm --filter @openora/core test:mutation
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-${{ matrix.shard }}
          path: packages/core/reports/${{ matrix.shard }}/

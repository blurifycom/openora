name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    # PR only: lints the PR's commits. On pushes to dev/stage the commits already passed
    # commitlint on their PR, and the push before-SHA is unreliable (null on a branch's
    # first push -> "Invalid revision range 0000...").
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      - name: Commitlint
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oss_igaming_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - name: Format check
        run: pnpm exec turbo run //#format:check
      - name: Lint
        run: pnpm exec turbo run //#lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Boundaries
        run: pnpm exec turbo run //#boundaries
      - name: Module shape
        run: pnpm exec turbo run //#verify:shape
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:unit
      - name: Tool tests
        run: pnpm exec turbo run //#test:tools
      - name: Create integration test database
        run: pnpm db:test:setup
      - name: Integration tests
        run: pnpm test:integration
      - name: Drift check
        run: pnpm verify:drift

name: CI

on:
  pull_request:
    # `edited` re-runs only the `commitlint` title check; `verify` skips it (see below).
    types: [opened, synchronize, reopened, edited]
  # Merge queue: required checks `verify` and `commitlint` must report on the queue's
  # temporary branch too, or the group never merges.
  merge_group:
  workflow_call:
  # audit-fix.yml opens its PR with the workflow token, which starts no `pull_request` run.
  workflow_dispatch:

# `edited` gets its own group so a retitle never cancels a running verify. Merge-group refs
# are unique per group, so groups never cancel each other; only superseded PR pushes do.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/oss_igaming_test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/oss_igaming_test
  TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  TEST_REDIS_URL: redis://localhost:6379
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oss_igaming_test

jobs:
  commitlint:
    # PR only does real work: lints the PR's commits + title. On pushes to dev/stage and in
    # the merge queue the commits already passed on their PR (and the push before-SHA is
    # unreliable), so the job still runs - the required check must report - but every step
    # but the last is skipped.
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No turbo here - taking the shared per-commit cache key would lock the verify
      # job out of saving its own task outputs.
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/bootstrap
        with:
          turbo-cache: 'false'
      - name: Commitlint
        if: github.event_name == 'pull_request' && github.event.action != 'edited'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      # A squash merge takes the PR title as the commit subject, so an unlinted title
      # lands on dev as a commit commitlint would have rejected.
      - name: Commitlint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm commitlint
      - name: Nothing to lint
        if: github.event_name != 'pull_request'
        run: echo "commitlint runs on pull requests only"

  # Everything in `pnpm verify` except the core integration tier (sharded below).
  checks:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - uses: ./.github/actions/test-infra
      # Same task list as the root `verify` script, but the core integration tier is
      # excluded (it runs in `integration`) - the other integration tiers stay here.
      # `build` is what typechecks (every package builds with tsc).
      - name: Verify
        run: >-
          pnpm exec turbo run build check:lint check:format check:boundaries check:shape
          check:hygiene check:refs check:deprecations test:unit test:tools &&
          pnpm exec turbo run test:integration --filter='!@openora/core' &&
          pnpm check:drift

  # The slowest tier (packages/core `vitest.integration.config.ts`), 3 shards. Each job has
  # its own postgres + redis, so per-suite databases and redis partitions are isolated.
  integration:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
        with:
          turbo-cache: 'false'
      - uses: ./.github/actions/test-infra
      - name: Core integration (shard ${{ matrix.shard }}/3)
        run: pnpm exec turbo run test:integration --filter=@openora/core -- --shard=${{ matrix.shard }}/3

  # Stable required-check name; aggregates the jobs above.
  verify:
    if: always() && github.event.action != 'edited'
    needs: [checks, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verify jobs green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*|*" skipped "*) exit 1;; esac

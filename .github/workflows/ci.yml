name: CI

# Mirrors .gitlab-ci.yml for GitHub. quality runs fast parallel jobs (each its own
# red/green); integration is gated behind quality so a DB is only spun up once lint
# and verify pass.

on:
  pull_request:
  push:
    branches: [main, dev, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BETTER_AUTH_SECRET: ci-secret-not-for-production-0000000000
  BETTER_AUTH_URL: http://localhost:3001

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify
      - run: pnpm verify:drift
      - run: pnpm eval:scaffold

  integration:
    runs-on: ubuntu-latest
    needs: [lint, verify]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oss_igaming_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oss_igaming_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:integration

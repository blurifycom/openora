# Package publishing (Changesets -> public npm).
#
# Channels:
#   push to dev   -> snapshot publish under dist-tag `alpha` (0.x.y-alpha-<sha>)
#   push to stage -> snapshot publish under dist-tag `rc`    (0.x.y-rc-<sha>)
#   tag    v*.*.* -> stable publish under dist-tag `latest`  (cut tags from prod/main)
#
# Packages are scoped `@openora/*`, published publicly ("publishConfig":
# { "access": "public" }). Auth uses the NPM_TOKEN repo secret (an npm
# automation token for the @openora org/user).
name: Release

on:
  push:
    branches: [dev, stage]
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The downstream consumer is identified ONLY by these secret VALUES - this repo
      # is public, so nothing about it (host, project, branch) is committed here.
      # Unset -> the trigger step is a no-op.
      CONSUMER_TRIGGER_URL: ${{ secrets.CONSUMER_TRIGGER_URL }}
      CONSUMER_TRIGGER_TOKEN: ${{ secrets.CONSUMER_TRIGGER_TOKEN }}
      # The example demo deploy (separate GitLab repo -> Railway). Identified ONLY by
      # these secret VALUES; unset -> the trigger step is a no-op.
      EXAMPLE_DEPLOY_TRIGGER_URL: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_URL }}
      EXAMPLE_DEPLOY_TRIGGER_TOKEN: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: '@openora'

      - name: Enable corepack (pnpm)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - run: pnpm install --frozen-lockfile
      # Build only the publishable packages - the apps (api, docs) are private and
      # never published, and the docs site is a separate deploy.
      - run: pnpm exec turbo run build --filter='!./apps/*'

      # Stable: a v*.*.* tag publishes the current versions under `latest`.
      # changeset publish skips any package+version already in the registry, so
      # re-running a tag is safe.
      - name: Publish stable (latest)
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Prerelease: dev -> alpha, stage -> rc. Each push snapshot-publishes an
      # immutable 0.x.y-<channel>-<shortsha> under the matching dist-tag. The
      # version bump is ephemeral (not committed); --no-git-tag avoids tagging.
      - name: Publish snapshot (alpha/rc)
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/stage'
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then CHANNEL=alpha; else CHANNEL=rc; fi
          SHORT=$(git rev-parse --short HEAD)
          pnpm changeset version --snapshot "$CHANNEL" --snapshot-prerelease-template "{tag}-$SHORT"
          pnpm changeset publish --no-git-tag --tag "$CHANNEL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Now that the new @openora/* version is on the registry, ask the downstream
      # consumer to open a bump MR. We POST its GitLab pipeline-trigger API (CONSUMER_*
      # secrets) with the published version. Only the alpha channel (push to dev)
      # auto-bumps the consumer dev branch; stage/prod bumps are promoted manually.
      # The consumer CI (OSS_BUMP=true) owns the pin/lockfile/MR. No-op when unset.
      - name: Trigger downstream consumer bump
        # Best-effort fire-and-forget - a trigger error must not fail the release
        # (publish already succeeded) or block later trigger steps.
        continue-on-error: true
        if: env.CONSUMER_TRIGGER_URL != '' && github.ref == 'refs/heads/dev'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          curl -sf -X POST "$CONSUMER_TRIGGER_URL" \
            -F "token=$CONSUMER_TRIGGER_TOKEN" \
            -F "ref=dev" \
            -F "variables[OSS_BUMP]=true" \
            -F "variables[OSS_VERSION]=$VERSION" \
            -F "variables[OSS_BUMP_TARGET]=dev"

      # Redeploy the public example demo (separate GitLab repo -> Railway). That repo
      # builds its own app against the published core; we pass the new version so its
      # pipeline bumps the @openora/core pin and `railway up`s. Only on the alpha
      # channel (push to dev). No-op when the secrets are unset.
      - name: Trigger example demo deploy
        continue-on-error: true
        if: env.EXAMPLE_DEPLOY_TRIGGER_URL != '' && github.ref == 'refs/heads/dev'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          curl -sf -X POST "$EXAMPLE_DEPLOY_TRIGGER_URL" \
            -F "token=$EXAMPLE_DEPLOY_TRIGGER_TOKEN" \
            -F "ref=main" \
            -F "variables[DEPLOY]=true" \
            -F "variables[OSS_VERSION]=$VERSION"

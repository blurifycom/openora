# Single push pipeline: ci -> release, plus a pre-release snapshot. One chained run per push.
#
# Release model (Changesets - automatic bump-and-publish):
#   - Every feature PR carries a changeset (`.changeset/*.md`) stating the change + semver bump.
#   - push to dev: `changesets/action` runs and does ONE of two things:
#       * pending changesets  -> opens/updates the "Version Packages" PR (bumps the fixed
#         `@openora/*` group + writes CHANGELOGs). Merging that PR is the release trigger.
#       * no pending changesets (the Version PR just merged) -> builds and `changeset publish`
#         -> npm dist-tag `latest`, a `v<version>` git tag, and a GitHub Release. Fully automatic.
#   - Between releases, every dev/stage push also publishes an immutable pre-release snapshot
#     (`<next>-alpha-<sha>` on dev, `-rc-<sha>` on stage) under its own dist-tag so consumers can
#     test unreleased work - skipped only on the dev commit that just cut a stable release.
#
# Auth: NPM_TOKEN (granular `@openora` token) for now. Once the first version is published,
# switch to npm Trusted Publishing (OIDC): drop NPM_TOKEN, keep `id-token: write` + a `npm`
# environment. CodeQL stays a separate workflow.
name: Pipeline

on:
  push:
    branches: [dev, stage]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump commit, create git tags + GitHub releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # ready for OIDC trusted publishing (no-op with NPM_TOKEN today)
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    env:
      # The changesets version commit runs the husky pre-commit hook (regen + typecheck),
      # which needs a built dist this job doesn't have - and CI already verified the commit.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: '@openora'

      - name: Enable corepack (pnpm)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - run: pnpm install --frozen-lockfile

      # Pending changesets -> Version PR. None -> `pnpm run release` (build + changeset publish
      # -> npm `latest` + git tag + GitHub Release). The action detects pnpm automatically.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  snapshot:
    needs: [ci, release]
    # Pre-release testing channel. Runs on every stage push (rc) and every dev push (alpha)
    # EXCEPT the dev commit that just published a stable release. `release` only runs on dev,
    # so on stage its output is empty and the second clause passes.
    if: ${{ always() && needs.ci.result == 'success' && (github.ref == 'refs/heads/stage' || needs.release.outputs.published != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The downstream consumer and example demo are identified ONLY by these secret VALUES -
      # this repo is public, so nothing about them is committed here. Unset -> the step no-ops.
      CONSUMER_TRIGGER_URL: ${{ secrets.CONSUMER_TRIGGER_URL }}
      CONSUMER_TRIGGER_TOKEN: ${{ secrets.CONSUMER_TRIGGER_TOKEN }}
      EXAMPLE_DEPLOY_TRIGGER_URL: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_URL }}
      EXAMPLE_DEPLOY_TRIGGER_TOKEN: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: '@openora'

      - name: Enable corepack (pnpm)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - run: pnpm install --frozen-lockfile
      # Build only the publishable packages - the apps are private and never published.
      - run: pnpm exec turbo run build --filter='!./apps/*'

      # Immutable snapshot: dev -> alpha, stage -> rc. `--no-git-tag` avoids tagging the
      # ephemeral version; `--tag` keeps it off the `latest` dist-tag.
      - name: Publish snapshot (alpha/rc)
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then CHANNEL=alpha; else CHANNEL=rc; fi
          SHORT=$(git rev-parse --short HEAD)
          pnpm changeset version --snapshot "$CHANNEL" --snapshot-prerelease-template "{tag}-$SHORT"
          pnpm changeset publish --no-git-tag --tag "$CHANNEL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Ask the downstream consumer to open a bump MR against its dev with the new snapshot
      # version (its CI owns the pin/lockfile/MR). Best-effort; a trigger error never fails
      # the run. No-op when the secret is unset. Dev (alpha) channel only.
      - name: Trigger downstream consumer bump
        continue-on-error: true
        if: env.CONSUMER_TRIGGER_URL != '' && github.ref == 'refs/heads/dev'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          curl -sf -X POST "$CONSUMER_TRIGGER_URL" \
            -F "token=$CONSUMER_TRIGGER_TOKEN" \
            -F "ref=dev" \
            -F "variables[OSS_BUMP]=true" \
            -F "variables[OSS_VERSION]=$VERSION" \
            -F "variables[OSS_BUMP_TARGET]=dev"

      # Redeploy the public example demo against the new snapshot. Best-effort; dev channel only.
      - name: Trigger example demo deploy
        continue-on-error: true
        if: env.EXAMPLE_DEPLOY_TRIGGER_URL != '' && github.ref == 'refs/heads/dev'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          curl -sf -X POST "$EXAMPLE_DEPLOY_TRIGGER_URL" \
            -F "token=$EXAMPLE_DEPLOY_TRIGGER_TOKEN" \
            -F "ref=main" \
            -F "variables[DEPLOY]=true" \
            -F "variables[OSS_VERSION]=$VERSION"

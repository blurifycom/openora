# Push pipeline: ci -> canary publish. One chained run per push.
#
# Dev commits land through the merge queue (tested there), so dev runs no CI here - only publish.
# Every push to dev publishes an immutable CANARY build (`<next>-canary.<run>`, dist-tag `canary`) -
# ALWAYS, independent of changesets: the base is the latest published stable patch-bumped so canary
# always leads it, and the CI run number is a monotonic sha-free counter. Nothing is committed. This
# is the rolling dev channel consumers track. Push to stage runs CI only.
#
# rc and stable are TAG-driven + changeset-driven (.github/workflows/release.yml): tag `vX.Y.Z-rc.N`
# -> `rc`, tag `vX.Y.Z` -> `latest`. CodeQL stays a separate workflow.
#
# Auth: NPM_TOKEN (npm automation / 2FA-bypass token); provenance signed via OIDC (id-token).
name: Pipeline

on:
  push:
    branches: [dev, stage]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # stage only: dev commits arrive through the merge queue, which already ran CI on them.
  ci:
    if: github.ref == 'refs/heads/stage'
    uses: ./.github/workflows/ci.yml

  snapshot:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (signed build attestation)
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # The example demo is identified ONLY by these secret VALUES -
      # this repo is public, so nothing about it is committed here. Unset -> the step no-ops.
      EXAMPLE_DEPLOY_TRIGGER_URL: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_URL }}
      EXAMPLE_DEPLOY_TRIGGER_TOKEN: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # No CI ran for this commit on dev, so the build below is a real compile (turbo cache
      # from earlier runs helps only where package inputs are unchanged).
      - uses: ./.github/actions/bootstrap

      # `setup-node` again purely for the npm registry auth the publish step needs -
      # bootstrap installs node but does not write an authenticated .npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: '@openora'

      # Build only the publishable packages - the apps are private and never published.
      - run: pnpm exec turbo run build --filter='!./apps/*'

      # Immutable canary build `<next>-canary.<run>`, published on EVERY dev push regardless of
      # changesets: base = latest published stable, patch-bumped so canary always leads it; the run
      # number is a monotonic sha-free counter. `changeset publish` needs no changesets - it ships any
      # version not yet on npm, and `<run>` makes each unique. `--tag canary` keeps it off `latest`.
      # Nothing is committed. (Stable/rc consume changesets - see release.yml.)
      - name: Publish canary
        run: |
          LATEST=$(npm view @openora/core version 2>/dev/null || node -p "require('./packages/core/package.json').version")
          NEXT=$(node -e 'const v=process.argv[1].split("-")[0].split(".").map(Number); console.log(v[0]+"."+v[1]+"."+(v[2]+1))' "$LATEST")
          export VERSION="${NEXT}-canary.${RUN}"
          echo "Publishing canary $VERSION"
          node -e "for (const p of ['packages/core/package.json','packages/mcp/package.json','packages/create-openora/package.json']) { const fs=require('fs'); const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n'); }"
          pnpm changeset publish --no-git-tag --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          RUN: ${{ github.run_number }}

      - name: Read published version
        id: version
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      # Redeploy the public example demo against the new snapshot. Best-effort; dev channel only.
      - name: Trigger example demo deploy
        continue-on-error: true
        if: env.EXAMPLE_DEPLOY_TRIGGER_URL != '' && github.ref == 'refs/heads/dev'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          curl -sf -X POST "$EXAMPLE_DEPLOY_TRIGGER_URL" \
            -F "token=$EXAMPLE_DEPLOY_TRIGGER_TOKEN" \
            -F "ref=main" \
            -F "variables[DEPLOY]=true" \
            -F "variables[OSS_VERSION]=$VERSION"

  # Separate job so bursts of merges collapse into ONE downstream bump: each run waits, and a
  # newer run's bump cancels this one while it waits (publishing above is never cancelled).
  bump:
    needs: snapshot
    runs-on: ubuntu-latest
    concurrency:
      group: betfeel-bump
      cancel-in-progress: true
    env:
      # Identified ONLY by secret VALUES (public repo). Unset -> the step no-ops.
      CONSUMER_TRIGGER_URL: ${{ secrets.CONSUMER_TRIGGER_URL }}
      CONSUMER_TRIGGER_TOKEN: ${{ secrets.CONSUMER_TRIGGER_TOKEN }}
      VERSION: ${{ needs.snapshot.outputs.version }}
    steps:
      - name: Wait for the burst to settle
        if: env.CONSUMER_TRIGGER_URL != ''
        run: sleep 300

      # Ask the downstream consumer to open a bump MR against its dev with the new canary
      # version (its CI owns the pin/lockfile/MR). Best-effort; canary (dev) channel only.
      - name: Trigger downstream consumer bump
        continue-on-error: true
        if: env.CONSUMER_TRIGGER_URL != ''
        run: |
          curl -sf -X POST "$CONSUMER_TRIGGER_URL" \
            -F "token=$CONSUMER_TRIGGER_TOKEN" \
            -F "ref=dev" \
            -F "variables[OSS_BUMP]=true" \
            -F "variables[OSS_VERSION]=$VERSION" \
            -F "variables[OSS_BUMP_TARGET]=dev"

# Single push pipeline: ci -> release, plus a pre-release snapshot. One chained run per push.
#
# Release model (Changesets, direct-to-branch - no PR):
#   - Every feature PR carries a changeset (`.changeset/*.md`) stating the change + semver bump.
#   - push to dev with pending changesets -> the release job runs `changeset version` (bumps the
#     fixed `@openora/*` group + writes CHANGELOGs), commits the bump straight to dev with
#     `[skip ci]` (so it doesn't re-trigger), then `changeset publish` -> npm dist-tag `latest`
#     + git tags. Fully automatic, no Version PR - avoids the org policy that blocks Actions from
#     creating pull requests; only `contents: write` is needed.
#   - push without pending changesets -> nothing is released; the snapshot job publishes an
#     immutable pre-release (`<next>-alpha-<sha>` on dev, `-rc-<sha>` on stage) for testing.
#
# Auth: NPM_TOKEN (granular `@openora` token). CodeQL stays a separate workflow.
name: Pipeline

on:
  push:
    branches: [dev, stage]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump commit + git tags (no create-PR needed)
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: '@openora'

      - name: Enable corepack (pnpm)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - run: pnpm install --frozen-lockfile

      # Pending changesets -> bump + commit (`[skip ci]`) + push to dev, then publish to npm +
      # push git tags. No pending -> no-op (the snapshot job handles pre-release testing).
      - id: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0 # the version commit skips the pre-commit hook; CI already verified this ref
        run: |
          shopt -s nullglob
          pending=$(ls .changeset/*.md 2>/dev/null | grep -v '/README.md$' || true)
          if [ -z "$pending" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets - nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          pnpm install --lockfile-only
          git add -A
          git commit -m "chore: version packages [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          pnpm build
          pnpm changeset publish
          git push origin --tags
          echo "published=true" >> "$GITHUB_OUTPUT"

  snapshot:
    needs: [ci, release]
    # Pre-release testing channel. Runs on every stage push (rc) and on dev pushes that did NOT
    # cut a stable release (alpha). `release` runs on dev only, so on stage its output is empty
    # and the first clause carries it.
    if: ${{ always() && needs.ci.result == 'success' && (github.ref == 'refs/heads/stage' || needs.release.outputs.published == 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The downstream consumer and example demo are identified ONLY by these secret VALUES -
      # this repo is public, so nothing about them is committed here. Unset -> the step no-ops.
      CONSUMER_TRIGGER_URL: ${{ secrets.CONSUMER_TRIGGER_URL }}
      CONSUMER_TRIGGER_TOKEN: ${{ secrets.CONSUMER_TRIGGER_TOKEN }}
      EXAMPLE_DEPLOY_TRIGGER_URL: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_URL }}
      EXAMPLE_DEPLOY_TRIGGER_TOKEN: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: '@openora'

      - name: Enable corepack (pnpm)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - run: pnpm install --frozen-lockfile
      # Build only the publishable packages - the apps are private and never published.
      - run: pnpm exec turbo run build --filter='!./apps/*'

      # Immutable snapshot: dev -> alpha, stage -> rc. `--no-git-tag` avoids tagging the
      # ephemeral version; `--tag` keeps it off the `latest` dist-tag.
      - name: Publish snapshot (alpha/rc)
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then CHANNEL=alpha; else CHANNEL=rc; fi
          SHORT=$(git rev-parse --short HEAD)
          pnpm changeset version --snapshot "$CHANNEL" --snapshot-prerelease-template "{tag}-$SHORT"
          pnpm changeset publish --no-git-tag --tag "$CHANNEL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Ask the downstream consumer to open a bump MR against its dev with the new snapshot
      # version (its CI owns the pin/lockfile/MR). Best-effort; a trigger error never fails
      # the run. No-op when the secret is unset. Dev (alpha) channel only.
      - name: Trigger downstream consumer bump
        continue-on-error: true
        if: env.CONSUMER_TRIGGER_URL != '' && github.ref == 'refs/heads/dev'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          curl -sf -X POST "$CONSUMER_TRIGGER_URL" \
            -F "token=$CONSUMER_TRIGGER_TOKEN" \
            -F "ref=dev" \
            -F "variables[OSS_BUMP]=true" \
            -F "variables[OSS_VERSION]=$VERSION" \
            -F "variables[OSS_BUMP_TARGET]=dev"

      # Redeploy the public example demo against the new snapshot. Best-effort; dev channel only.
      - name: Trigger example demo deploy
        continue-on-error: true
        if: env.EXAMPLE_DEPLOY_TRIGGER_URL != '' && github.ref == 'refs/heads/dev'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          curl -sf -X POST "$EXAMPLE_DEPLOY_TRIGGER_URL" \
            -F "token=$EXAMPLE_DEPLOY_TRIGGER_TOKEN" \
            -F "ref=main" \
            -F "variables[DEPLOY]=true" \
            -F "variables[OSS_VERSION]=$VERSION"

# Push pipeline: ci -> alpha snapshot. One chained run per push.
#
# Every push to dev publishes an immutable ALPHA snapshot (`<next>-alpha-<sha>`, dist-tag `alpha`),
# the version auto-computed from pending changesets. It's ephemeral: `changeset version --snapshot`
# runs in a throwaway working tree (changesets are NOT consumed, nothing is committed), then
# publishes under the `alpha` dist-tag so `latest` is never touched. Push to stage runs CI only.
#
# rc and stable are TAG-driven (.github/workflows/release.yml): tag `vX.Y.Z-rc.N` -> `rc`,
# tag `vX.Y.Z` -> `latest`. CodeQL stays a separate workflow.
#
# Auth: NPM_TOKEN (npm automation / 2FA-bypass token).
name: Pipeline

on:
  push:
    branches: [dev, stage]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  snapshot:
    needs: ci
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The downstream consumer and example demo are identified ONLY by these secret VALUES -
      # this repo is public, so nothing about them is committed here. Unset -> the step no-ops.
      CONSUMER_TRIGGER_URL: ${{ secrets.CONSUMER_TRIGGER_URL }}
      CONSUMER_TRIGGER_TOKEN: ${{ secrets.CONSUMER_TRIGGER_TOKEN }}
      EXAMPLE_DEPLOY_TRIGGER_URL: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_URL }}
      EXAMPLE_DEPLOY_TRIGGER_TOKEN: ${{ secrets.EXAMPLE_DEPLOY_TRIGGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: '@openora'

      - name: Enable corepack (pnpm)
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - run: pnpm install --frozen-lockfile
      # Build only the publishable packages - the apps are private and never published.
      - run: pnpm exec turbo run build --filter='!./apps/*'

      # Immutable alpha snapshot. `--no-git-tag` avoids tagging the ephemeral version; `--tag alpha`
      # keeps it off `latest`. Changesets are not consumed (the working-tree bump is discarded).
      - name: Publish alpha snapshot
        run: |
          SHORT=$(git rev-parse --short HEAD)
          pnpm changeset version --snapshot alpha --snapshot-prerelease-template "{tag}-$SHORT"
          pnpm changeset publish --no-git-tag --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Ask the downstream consumer to open a bump MR against its dev with the new snapshot
      # version (its CI owns the pin/lockfile/MR). Best-effort; alpha (dev) channel only.
      - name: Trigger downstream consumer bump
        continue-on-error: true
        if: env.CONSUMER_TRIGGER_URL != '' && github.ref == 'refs/heads/dev'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          curl -sf -X POST "$CONSUMER_TRIGGER_URL" \
            -F "token=$CONSUMER_TRIGGER_TOKEN" \
            -F "ref=dev" \
            -F "variables[OSS_BUMP]=true" \
            -F "variables[OSS_VERSION]=$VERSION" \
            -F "variables[OSS_BUMP_TARGET]=dev"

      # Redeploy the public example demo against the new snapshot. Best-effort; dev channel only.
      - name: Trigger example demo deploy
        continue-on-error: true
        if: env.EXAMPLE_DEPLOY_TRIGGER_URL != '' && github.ref == 'refs/heads/dev'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          curl -sf -X POST "$EXAMPLE_DEPLOY_TRIGGER_URL" \
            -F "token=$EXAMPLE_DEPLOY_TRIGGER_TOKEN" \
            -F "ref=main" \
            -F "variables[DEPLOY]=true" \
            -F "variables[OSS_VERSION]=$VERSION"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oss_igaming
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Required. createApp is distributed-only (ADR-0030): it binds the durable seams
  # (MESSAGE_BROKER, JOB_QUEUE, CACHE, RATE_LIMITER) from REDIS_URL and refuses to
  # boot with any of them unbound. Setting REDIS_URL in .env auto-binds all four.
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

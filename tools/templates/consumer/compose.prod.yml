# The whole app on one server: `docker compose -f compose.prod.yml up -d --build`.
# Migrations run first, then the API and the chat service start (one image, one shared
# database), behind a small gateway on API_PORT (default 3001) that sends the chat paths to
# the chat service. Secrets come from .env: set AUTH_SECRET, WITHDRAWAL_PIN_HMAC_SECRET,
# INTERNAL_API_SECRETS and POSTGRES_PASSWORD (letters and digits only, it goes into a URL).
# No demo data is seeded here. To run chat inside the API instead, see
# docs/guides/split-deployment.md: drop the `chat` and `gateway` services, publish `api`,
# and remove SERVICE_MANIFEST, SERVICE_NAME, REALTIME_NAMESPACE and CHAT_SERVICE_URL from it.
x-runtime: &runtime
  build: .
  env_file: .env
  environment: &runtime-env
    NODE_ENV: production
    PORT: 3001
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/oss_igaming
    REDIS_URL: redis://redis:6379
    INTERNAL_API_SECRETS: ${INTERNAL_API_SECRETS:?set INTERNAL_API_SECRETS in .env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: oss_igaming
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *runtime
    command: ['pnpm', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy

  # Everything but chat. `chat-remote` stands in for the chat module: it binds the chat ports
  # to the chat service's internal API. Pinned to the names a monolith already uses.
  api:
    <<: *runtime
    environment:
      <<: *runtime-env
      SERVICE_NAME: monolith
      REALTIME_NAMESPACE: monolith
      SERVICE_MANIFEST: audit,identity,iam,mail,notifications,exchange-rate,wallet,gaming,lobby,profile,tag,player-management,compliance,admin-console,analytics,player-note,cms,chat-remote
      CHAT_SERVICE_URL: http://chat:3001
      CHAT_SERVICE_ALLOW_HTTP: 'true' # the compose network is private; use https across hosts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Chat on its own, on the shared database. Identity, iam and the rest load for their ports only.
  chat:
    <<: *runtime
    environment:
      <<: *runtime-env
      SERVICE_NAME: chat
      REALTIME_NAMESPACE: monolith
      SERVICE_MANIFEST: chat,identity:no-routes,iam:no-routes,audit:no-routes,mail:no-routes,compliance:no-routes,wallet:no-routes,gaming:no-routes,exchange-rate:no-routes,player-management:no-routes,tag:no-routes
      JOB_WORKERS: chat-*
      CHAT_BLOCK_READER_CALLERS: monolith
      CHAT_TRANSFER_CHECK_CALLERS: monolith
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The one public entry: chat paths to the chat service, the rest to the API. Put a TLS reverse
  # proxy (Caddy, nginx) in front of it for the public domain.
  gateway:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '127.0.0.1:${API_PORT:-3001}:80'
    depends_on:
      - api
      - chat
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

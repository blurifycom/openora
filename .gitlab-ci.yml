# GitLab CI for igaming-oss (the platform core).
#
# quality stage runs fast, granular, parallel jobs (each reports its own red/green):
#   lint + format  -> source-only, no build, seconds of feedback
#   verify         -> build + typecheck + unit + module-shape + boundaries + catalog drift
# integration is gated behind quality (don't spin a DB if lint fails).

image: node:26

stages:
  - quality
  - security
  - test # safety net: GitLab scanner templates default to `test`; keep it valid
  - integration
  - release

# GitLab-managed scanners (SCA + SAST + secrets). Execution runs on any tier;
# the MR security widget + vulnerability dashboard need Ultimate, but the JSON
# reports are emitted as artifacts regardless. See the `# --- security ---`
# section below for the stage/before_script overrides that fit them into this
# pipeline (the analyzer images have no node/pnpm, so our default before_script
# must be cleared on each).
include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Run on merge requests, the long-lived branches (default + env branches), and
# release tags (v1.2.3) which trigger the publish stage.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^(dev|stage)$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

variables:
  BETTER_AUTH_SECRET: ci-secret-not-for-production-0000000000
  BETTER_AUTH_URL: http://localhost:3001
  PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store

default:
  interruptible: true
  before_script:
    # node:26 no longer bundles corepack on PATH; install it before enabling.
    - npm install -g corepack@latest
    - corepack enable
    - corepack prepare pnpm@11.5.2 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

# Two cache entries:
#  - pnpm content-addressable store, keyed on the lockfile (fast relink on install).
#  - Turbo local cache, keyed per branch with a main fallback so branches warm-start.
cache:
  - key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  - key: 'turbo-$CI_COMMIT_REF_SLUG'
    fallback_keys:
      - 'turbo-main'
    paths:
      - .turbo

# --- quality (parallel, DAG) -------------------------------------------------

lint:
  stage: quality
  needs: []
  script:
    - pnpm lint
    - pnpm boundaries

format:
  stage: quality
  needs: []
  script:
    - pnpm format:check

# Non-blocking warning: surfaces @deprecated API usage without failing the pipeline.
deprecations:
  stage: quality
  needs: []
  allow_failure: true
  script:
    - pnpm deprecations

# Comprehensive gate. Catalog drift fails if generated docs are stale vs the code.
verify:
  stage: quality
  needs: []
  script:
    - pnpm build
    - pnpm verify
    - pnpm verify:drift

# --- security (SCA + SAST + secrets) -----------------------------------------
#
# Three layers, all non-blocking for now (allow_failure: true) so they surface
# findings without wedging the pipeline - flip to blocking once the baseline is
# clean. The included GitLab analyzers run in their own images, so each override
# clears our node/pnpm before_script (which would otherwise fail in them) and
# moves the job into the `security` stage with no upstream needs.

# SCA over the lockfile. The exact equivalent of the consumer Code Review Bot's
# esbuild finding. Job name is `dependency_scanning` in the current analyzer
# (older Gemnasium templates used `gemnasium-dependency_scanning`). The
# `dependency_audit` job below is a tier/analyzer-independent backstop.
dependency_scanning:
  stage: security
  needs: []
  before_script: []
  allow_failure: true

semgrep-sast:
  stage: security
  needs: []
  before_script: []
  allow_failure: true

secret_detection:
  stage: security
  needs: []
  before_script: []
  allow_failure: true

# Guaranteed-working SCA net: `pnpm audit` against the registry advisory DB.
# Independent of GitLab edition and analyzer pnpm support, so it always catches
# the esbuild-class CVE. Non-blocking at `high`; tighten the level to gate.
dependency_audit:
  stage: security
  needs: []
  allow_failure: true
  script:
    - pnpm audit --audit-level=high

# --- integration (Postgres) --------------------------------------------------

# service + router integration tests via app.request() against real Postgres.
integration:
  stage: integration
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: oss_igaming_test
    # GitLab service hostname is the image alias `postgres`, not localhost.
    TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/oss_igaming_test
  script:
    - pnpm build
    - pnpm test:integration

# --- release (publish to the GitLab npm registry) ----------------------------

# Publishes every @oss/* + @oss-addons/* package (one fixed version, Changesets)
# to THIS project's npm registry. Triggered by a release tag (v1.2.3). The
# downstream consumer installs from the same registry. See ADR-0022.
#
# CI_API_V4_URL / CI_PROJECT_ID / CI_JOB_TOKEN are predefined - no hardcoded
# project id or PAT. The job token can read+write this project's registry.
publish:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - |
      {
        echo "@oss:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "@oss-addons:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}"
      } >> .npmrc
    # changeset publish skips any package whose version already exists in the
    # registry, so re-running a tag is safe. workspace:* is rewritten to the
    # fixed version in each published tarball.
    - pnpm build
    - pnpm changeset publish

# After a successful publish, kick consumer's auto-bump pipeline so it opens an MR
# bumping @oss/* to the just-published version (push-trigger, ADR-0022). Reads the
# new version from the release tag (v0.3.0 -> 0.3.0). Requires a consumer pipeline
# TRIGGER token stored here as the masked CI var CONSUMER_BUMP_TRIGGER_TOKEN
# (Settings > CI/CD > Variables); consumer is the private registry. If the var is unset the
# job no-ops (allow_failure) so a publish is never blocked on the downstream hook.
trigger-consumer-bump:
  stage: release
  needs: ['publish']
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  allow_failure: true
  before_script: []
  script:
    - |
      if [ -z "$CONSUMER_BUMP_TRIGGER_TOKEN" ]; then
        echo "CONSUMER_BUMP_TRIGGER_TOKEN unset - skipping downstream bump trigger"; exit 0
      fi
    - |
      node -e '
        const version = (process.env.CI_COMMIT_TAG || "").replace(/^v/, "");
        const url = `${process.env.CI_API_V4_URL}/projects/299/trigger/pipeline`;
        const body = new URLSearchParams({
          token: process.env.CONSUMER_BUMP_TRIGGER_TOKEN,
          ref: "main",
          "variables[OSS_BUMP]": "true",
          "variables[OSS_VERSION]": version,
          "variables[OSS_BUMP_TARGET]": "main",
        });
        fetch(url, { method: "POST", body }).then(async (r) => {
          const text = await r.text();
          if (!r.ok) { console.error("trigger failed", r.status, text); process.exit(1); }
          console.log("triggered consumer bump for", version, "->", r.status);
        }).catch((e) => { console.error(e); process.exit(1); });
      '

# --- prerelease channels: dev -> alpha, stage -> beta (snapshot publishes) ----
# Each push to dev/stage snapshot-publishes an immutable 0.4.0-<channel>-<datetime>
# under the matching npm dist-tag, then triggers consumer's auto-bump on the
# matching branch (dev<-alpha, stage<-beta). Stable is the tag-driven `publish`
# job above (main<-latest). The snapshot bases on the pending changesets' next
# version via snapshot.useCalculatedVersion in .changeset/config.json. allow_failure
# so a publish hiccup never blocks dev/stage CI. See ADR-0022.
publish-prerelease:
  stage: release
  # Gate on the build/test + lint gates only (DAG) so an alpha publishes as soon
  # as those pass, instead of waiting on the whole pipeline (esp. the slow
  # integration-DB job). `pnpm build` below is a Turbo cache hit from `verify`.
  needs: ['verify', 'lint']
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        CHANNEL: alpha
    - if: $CI_COMMIT_BRANCH == "stage"
      variables:
        CHANNEL: beta
  allow_failure: true
  script:
    - |
      {
        echo "@oss:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "@oss-addons:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}"
      } >> .npmrc
    - pnpm build
    - pnpm changeset version --snapshot "$CHANNEL"
    - pnpm changeset publish --no-git-tag --tag "$CHANNEL"
    - echo "OSS_PRERELEASE_VERSION=$(node -p "require('./packages/core/package.json').version")" >> bump.env
    - echo "CONSUMER_REF=$CI_COMMIT_BRANCH" >> bump.env
    - cat bump.env
  artifacts:
    reports:
      dotenv: bump.env

trigger-consumer-prerelease:
  stage: release
  needs: ['publish-prerelease']
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "stage"
  allow_failure: true
  before_script: []
  script:
    - |
      if [ -z "$CONSUMER_BUMP_TRIGGER_TOKEN" ] || [ -z "$OSS_PRERELEASE_VERSION" ]; then
        echo "missing trigger token or prerelease version - skipping"; exit 0
      fi
    - |
      node -e '
        const version = process.env.OSS_PRERELEASE_VERSION;
        const ref = process.env.CONSUMER_REF;
        const url = `${process.env.CI_API_V4_URL}/projects/299/trigger/pipeline`;
        const body = new URLSearchParams({
          token: process.env.CONSUMER_BUMP_TRIGGER_TOKEN,
          ref,
          "variables[OSS_BUMP]": "true",
          "variables[OSS_VERSION]": version,
          "variables[OSS_BUMP_TARGET]": ref,
        });
        fetch(url, { method: "POST", body }).then(async (r) => {
          const text = await r.text();
          if (!r.ok) { console.error("trigger failed", r.status, text); process.exit(1); }
          console.log("triggered consumer prerelease bump", version, "->", ref, r.status);
        }).catch((e) => { console.error(e); process.exit(1); });
      '

# GitLab CI for igaming-oss (the platform core).
#
# quality stage runs fast, granular, parallel jobs (each reports its own red/green):
#   lint + format  -> source-only, no build, seconds of feedback
#   verify         -> build + typecheck + unit + module-shape + boundaries + catalog drift
# integration / e2e are gated behind quality (don't spin a DB if lint fails).

image: node:22

stages:
  - quality
  - integration
  - e2e

# Run on merge requests and on the long-lived branches (default + env branches).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^(dev|stage)$/

variables:
  BETTER_AUTH_SECRET: ci-secret-not-for-production-0000000000
  BETTER_AUTH_URL: http://localhost:3001
  PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store

default:
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.1.3 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

# Two cache entries:
#  - pnpm content-addressable store, keyed on the lockfile (fast relink on install).
#  - Turbo local cache, keyed per branch with a main fallback so branches warm-start.
cache:
  - key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  - key: "turbo-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "turbo-main"
    paths:
      - .turbo

# --- quality (parallel, DAG) -------------------------------------------------

lint:
  stage: quality
  needs: []
  script:
    - pnpm lint

format:
  stage: quality
  needs: []
  script:
    - pnpm format:check

# Comprehensive gate. Catalog drift fails if generated docs are stale vs the code.
verify:
  stage: quality
  needs: []
  script:
    - pnpm build
    - pnpm verify
    - pnpm verify:drift

# --- integration (Postgres) --------------------------------------------------

# service + router integration tests via app.request() against real Postgres.
integration:
  stage: integration
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: oss_igaming_test
    # GitLab service hostname is the image alias `postgres`, not localhost.
    TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/oss_igaming_test
  script:
    - pnpm build
    - pnpm test:integration

# --- e2e (Postgres + Playwright) ---------------------------------------------

# Playwright boots the stack itself (E2E_WEBSERVER=1 -> turbo dev); global-setup
# migrates + seeds.
e2e:
  stage: e2e
  timeout: 30m
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: oss_igaming
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/oss_igaming
    E2E_WEBSERVER: "1"
  script:
    - pnpm build
    - pnpm -F @oss/e2e exec playwright install --with-deps chromium
    - pnpm test:e2e
  artifacts:
    name: playwright-report
    when: on_failure
    paths:
      - apps/e2e/playwright-report/
    expire_in: 7 days

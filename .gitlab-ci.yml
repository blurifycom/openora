# GitLab CI - mirror of .github/workflows/ci.yml
# Three stages: verify (no DB), integration (Postgres), e2e (Postgres + Playwright).
# Reuses the same pnpm scripts as the GitHub workflow.

image: node:22

stages:
  - verify
  - integration
  - e2e

# Run on merge requests and on the long-lived branches (default + env branches).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^(dev|stage)$/

# Global env - matches the GitHub workflow `env:` block.
variables:
  BETTER_AUTH_SECRET: ci-secret-not-for-production-0000000000
  BETTER_AUTH_URL: http://localhost:3001
  # pnpm store inside the project dir so GitLab cache can pick it up.
  PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store

# Cancel superseded runs (mirrors GitHub concurrency cancel-in-progress).
default:
  interruptible: true
  # Shared pnpm setup: enable corepack, pin pnpm, point store at the cached dir.
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.1.3 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

# Cache pnpm store + node_modules across jobs, keyed on the lockfile.
cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store
    - node_modules
    - "**/node_modules"

# typecheck + unit tests + lint + module-shape. No database needed.
verify:
  stage: verify
  script:
    - pnpm build
    - pnpm verify

# service + router integration tests via app.request() against real Postgres.
integration:
  stage: integration
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: oss_igaming_test
    # GitLab service hostname is the image alias `postgres`, not localhost.
    TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/oss_igaming_test
  script:
    - pnpm build
    - pnpm test:integration

# browser E2E against the reference apps. Playwright boots the stack itself
# (E2E_WEBSERVER=1 -> turbo dev) and global-setup migrates + seeds.
e2e:
  stage: e2e
  timeout: 30m
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: oss_igaming
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/oss_igaming
    E2E_WEBSERVER: "1"
  script:
    - pnpm build
    - pnpm -F @oss/e2e exec playwright install --with-deps chromium
    - pnpm test:e2e
  artifacts:
    name: playwright-report
    when: on_failure
    paths:
      - apps/e2e/playwright-report/
    expire_in: 7 days

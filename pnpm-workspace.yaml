packages:
  - 'apps/*'
  - 'packages/*/*' # includes packages/addons/* (every feature is a standalone add-on package)
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  tldjs: false
minimumReleaseAgeExclude:

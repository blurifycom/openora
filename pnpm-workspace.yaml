  - '@oxfmt/binding-linux-ppc64-gnu@0.54.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.54.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.54.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.54.0'
  - '@oxfmt/binding-linux-x64-gnu@0.54.0'

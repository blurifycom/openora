packages:
  - 'apps/*'
  - 'packages/core'
  - 'packages/mcp'
  - 'packages/create-openora'
  - 'packages/testing'
  - 'packages/*/*'
# Pin a single React version across the workspace - the SDK peer-deps `>=19`, so
# without this transitive deps drift across patch releases (19.2.0/19.2.6/...).
overrides:
  react: 19.2.7
  react-dom: 19.2.7
  # Security pins (transitive, high-severity - dependency_audit gates at `high`).
  esbuild@<0.28.1: '>=0.28.1' # GHSA-gv7w-rqvm-qjhr (also clears its moderate + low)
  form-data@<4.0.6: '>=4.0.6' # GHSA-hmw2-7cc7-3qxx (via rulesync>fastmcp>...>axios)
  undici@>=7.23.0 <7.29.0: '>=7.29.0 <8' # GHSA-4cwx-7wf7-3272 + GHSA-vmh5-mc38-953g (via rulesync>fastmcp>undici); stay on the 7.x major fastmcp expects
  axios@<1.18.0: '>=1.18.0 <2' # GHSA-gcfj-64vw-6mp9
  brace-expansion@>=3.0.0 <5.0.7: '>=5.0.7 <6' # GHSA-3jxr-9vmj-r5cp
  fast-uri@>=3.0.0 <3.1.5: '>=3.1.5 <4' # GHSA-7p8r-x3mc-p8w7
  ip-address@<10.3.1: '>=10.3.1 <11' # GHSA-mwp4-54f8-5fhr
  js-yaml@>=3.0.0 <3.15.1: '>=3.15.1 <4' # GHSA-5p4m-2wfm-xmqj
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1 <5' # GHSA-5p4m-2wfm-xmqj
  js-yaml@>=5.0.0 <5.2.2: '>=5.2.2 <6' # GHSA-pm4m-ph32-ghv5
  nanoid@<3.3.18: '>=3.3.18 <4' # GHSA-2v37-7h3g-55p8
  postcss@<8.5.23: '>=8.5.23 <9' # GHSA-r28c-9q8g-f849
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  tldjs: false
minimumReleaseAgeExclude:
  - 'rulesync@15.1.0'

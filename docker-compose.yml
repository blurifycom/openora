services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oss_igaming
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Durable inter-module broker (MESSAGE_BROKER overlay). OPT-IN via the `broker`
  # profile for local broker testing: `docker compose --profile broker up`. The
  # platform is headless - it ships no runnable API; a consumer app binds the
  # broker by setting AMQP_URL and adding its own overlay. Management UI on
  # :15672 (guest/guest). See ADR-0016.
  rabbitmq:
    profiles: ['broker']
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # Distributed CACHE + RATE_LIMITER reference backend. OPT-IN via the `redis`
  # profile: `docker compose --profile redis up`. A consumer app binds it by setting
  # REDIS_URL (redis://localhost:6379) - createApp auto-binds the Redis adapters, no
  # code change. See ADR-0028.
  redis:
    profiles: ['redis']
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
